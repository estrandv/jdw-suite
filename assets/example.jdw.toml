# JDW Ecosystem — Central Configuration
# Location: ~/.config/jdw.toml (or $JDW_CONFIG env var)
#
# Per-app config.toml files in each project directory override
# these values. Compiled-in defaults are the final fallback.

[network]
router_port = 13339

[router]
bind_address = "127.0.0.1"
bind_port = 13339
buffer_size = 333000

[sc]
application_ip = "127.0.0.1"
server_osc_socket_name = "o"
server_name = "s"
sc_server_incoming_read_timeout = 30
server_out_port = 13338
sclang_in_port = 13336
server_in_port = 13337
outgoing_port = 13339
application_in_port = 13331
supercollider_memory_bytes = 2000000
log_level = "debug"
init_wait_timeout_secs = 10
sample_pack_dir = "/usr/local/share/jdw/sample_packs"
temp_dir = "temp"
sclang_binary = "sclang"
poll_sleep_ms = 10
default_bpm = 120
buffer_size = 333072
nrt_done_timeout_secs = 10
first_node_id = 100
sample_buffer_frames = 352800.0
sample_channels = 2
group_id = 0
group_placement = 0
beep_frequencies = [130.81, 146.83, 196.0]
beep_spacing_ms = 125

[sequencer]
application_ip = "127.0.0.1"
application_in_port = 14441
application_out_port = 13339
application_out_socket_port = 14444
tick_time_us = 5000
sequencer_start_mode = 1
sequencer_reset_mode = 1
real_time_mode = true
midi_sync = false
ringbuf_capacity = 100
default_bpm = 120
buffer_size = 333072
log_level = "info"

[pycompose]
bbd_root = "/usr/local/share/jdw"
router_host = "127.0.0.1"
router_port = 13339
sample_pack_dir = "/usr/local/share/jdw/sample_packs"
synthdefs_scd_path = "/usr/local/share/jdw/synthdefs.scd"
template_synths_path = "/usr/local/share/jdw/template_synths.txt"
common_macros_dir = "/usr/local/share/jdw"
first_buffer_index = 100

[pycompose.delays]
inter_message = 0.005
configure = 0.001
nrt_preload = 0.005
update = 0.005
quiet = 0.005

[suite]
control_port = 13340
control_address = "127.0.0.1"
nrt_listener_port_base = 13456
sequencer_in_port = 14441

[helper-scripts]
python = "$HOME/mypython/bin/python"
pycompose_run = "$HOME/programming/jdw-pycompose/run.py"
sequencer_dir = "$HOME/programming/jdw-sequencer"
router_dir = "$HOME/programming/jdw-osc-router"
sc_dir = "$HOME/programming/jdw-sc"
