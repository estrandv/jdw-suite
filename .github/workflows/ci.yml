# CI temporarily disabled — see docs/RELEASE_0_1.md

# Cargo git dependencies (jdw-billboarding-backend, jdw-sc, etc.) fail to
# clone in GitHub Actions even though all repos are public. Every approach
# tried (url.insteadOf, extraheader, GIT_CONFIG_NOSYSTEM, GIT_ASKPASS,
# credential.helper, CARGO_NET_GIT_FETCH_WITH_CLI, libgit2) hits the same:
#
#   failed to authenticate when downloading repository
#
# This is a known libgit2/Cargo limitation in CI runners. The proper fix
# is publishing each crate to crates.io, then using normal version deps.
#
# Until then, releases are built locally via scripts/release.sh.
