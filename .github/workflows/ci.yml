name: Release

on:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            sc_install: sudo apt-get update && sudo apt-get install -y supercollider

          - target: x86_64-apple-darwin
            os: macos-latest
            sc_install: brew install supercollider

          - target: aarch64-apple-darwin
            os: macos-latest
            sc_install: brew install supercollider

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install SuperCollider
        run: ${{ matrix.sc_install }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/jdw release/
          cp assets/hello.bbd release/
          cp assets/synthdefs.scd release/
          cp assets/example.jdw.toml release/
          cp assets/install.sh release/
          cd release && zip -r ../jdw-v0.1-${{ matrix.target }}.zip .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: jdw-v0.1-*.zip
