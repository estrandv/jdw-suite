name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""

          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""

          - target: x86_64-apple-darwin
            os: macos-13
            ext: ""

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build
        env:
          GIT_CONFIG_NOSYSTEM: "1"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir release
          cp target/${{ matrix.target }}/release/jdw${{ matrix.ext }} release/
          cp assets/hello.bbd release/
          cp assets/synthdefs.scd release/
          cp assets/example.jdw.toml release/
          cp assets/install.sh release/
          cd release && zip -r ../jdw-v0.1-${{ matrix.target }}.zip .

      - name: Upload to Release
        uses: softprops/action-gh-release@v2
        with:
          files: jdw-v0.1-*.zip
